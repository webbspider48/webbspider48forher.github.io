<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bigdugg 7</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="booting" data-page="home">

    <!-- BOOT SCREEN -->
    <div id="boot-screen" class="screen boot-screen">
        <div class="boot-content">
            <div class="win-logo"><i></i><i></i><i></i><i></i></div>
            <h1>Starting Bigdugg 7</h1>
            <div class="boot-loader"><div id="boot-progress"></div></div>
            <p id="boot-status">Initialising...</p>
        </div>
        <p class="boot-copy">Copyright © Bigdugg Corporation. Made with ❤️</p>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="screen login-screen hidden">
        <div class="login-box">
            <div class="avatar">🌸</div>
            <div class="login-name" id="login-name">User</div>
            <div class="login-row">
                <input type="password" id="login-pass" placeholder="Password" autocomplete="off">
                <button id="login-go" class="login-go" aria-label="Log in">➜</button>
            </div>
            <p class="login-hint">Hint: just press the arrow ❤️</p>
        </div>
        <button id="login-ease" class="login-foot-btn left">♿ Ease of Access</button>
        <button id="login-shutdown" class="login-foot-btn right">⏻ Shut down</button>
    </div>

    <!-- WELCOME SCREEN -->
    <div id="welcome-screen" class="screen welcome-screen hidden">
        <div class="spinner"></div>
        <span>Welcome</span>
    </div>

    <!-- DESKTOP (icons, taskbar and windows are added by script.js) -->
    <div id="desktop" class="desktop">
        <aside class="gadget glass" id="gadget">
            <div class="gadget-title">It's been a while. ❤️</div>
            <div class="gadget-sub" id="gadget-sub">You have 1 new message</div>
            <button class="btn" id="gadget-open">Open Mail</button>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
