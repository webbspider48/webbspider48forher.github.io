<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bigdugg OS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         BOOT SCREEN
    ========================== -->

    <div id="boot-screen" class="boot-screen">

        <div class="boot-content">

            <div class="linux-logo">
                🐧
            </div>

            <h1>BIGDUGG OS</h1>

            <p>Starting something special...</p>

            <div class="boot-loader">
                <div id="boot-progress"></div>
            </div>

            <p id="boot-status">
                Initialising...
            </p>

        </div>

    </div>


    <!-- =========================
         DESKTOP
    ========================== -->

    <div id="desktop" class="desktop hidden">

        <!-- Top bar -->

        <header class="top-bar">

            <div class="activities">
                Activities
            </div>

            <div class="top-title">
                Bigdugg OS
            </div>

            <div class="system-icons">

                <span>⌁</span>
                <span>🔊</span>
                <span>🔋</span>

            </div>

        </header>


        <!-- Desktop -->

        <main class="desktop-content">

            <div class="welcome-text">

                <h1>
                    It's been a while.
                </h1>

                <p>
                    ❤️
                </p>

            </div>


            <!-- Message -->

            <button
                class="message-icon"
                onclick="showNotification()"
            >

                <div class="mail-container">

                    <span class="mail-icon">
                        ✉️
                    </span>

                    <span class="message-count">
                        1
                    </span>

                </div>

                <span class="message-label">
                    New Message
                </span>

            </button>

        </main>


        <!-- =========================
             NOTIFICATION
        ========================== -->

        <div
            id="notification"
            class="notification"
        >

            <div class="notification-header">

                <span>
                    🔔 SYSTEM NOTICE
                </span>

                <button
                    class="notification-close"
                    onclick="closeNotification()"
                >
                    ×
                </button>

            </div>


            <div class="notification-body">

                <h3>
                    1 important message
                    requires your attention.
                </h3>


                <div class="risk-box">

                    <div class="risk-label">
                        RISK LEVEL
                    </div>

                    <div class="risk-value">
                        HIGH ❤️
                    </div>

                </div>


                <p>

                    <strong>Reason:</strong>

                    It's been a while since
                    you received one of these.

                </p>


                <button
                    class="review-button"
                    onclick="openLetter()"
                >
                    REVIEW MESSAGE
                </button>

            </div>

        </div>


        <!-- =========================
             DOCK
        ========================== -->

        <nav class="dock">

            <button>📁</button>

            <button>🌐</button>

            <button onclick="showNotification()">
                ✉️
            </button>

            <button>⚙️</button>

        </nav>

    </div>


    <script src="script.js"></script>

</body>

</html>
